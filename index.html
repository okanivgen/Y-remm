<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel...</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; background: linear-gradient(rgba(13, 13, 13, 0.88), rgba(13, 13, 13, 0.95)), url('https://images.unsplash.com/photo-1511192336575-5a79af67a629?q=80&w=1920') center/cover no-repeat; }
        .container { max-width: 650px; width: 100%; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 20px; padding: 40px 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        h1 { font-family: 'Alex Brush', cursive; font-size: 3rem; color: #d4af37; margin-bottom: 25px; }
        .poem-box { min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 30px; transition: opacity 0.5s; }
        .poem-text { font-family: 'Cinzel', serif; font-size: 1.1rem; line-height: 1.8; color: #f5f5f5; font-style: italic; }
        .poem-author { margin-top: 20px; font-size: 0.85rem; color: #d4af37; text-transform: uppercase; }
        button { background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 14px 28px; border-radius: 30px; cursor: pointer; transition: 0.3s; margin: 5px; }
        button:hover { background: #d4af37; color: #0d0d0d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bir Melodi, Bir Pişmanlık...</h1>
        <div class="poem-box" id="poemBox">
            <p class="poem-text" id="poemText">Sana bakmak bütün haftanın yorgunluğunu almak gibi.<br>Bir keman sesinde kaybolmak gibi seni sevmek...</p>
            <p class="poem-author" id="poemAuthor">- Turgut Uyar -</p>
        </div>
        <button onclick="nextPoem()">Başka Bir Şiir 📜</button>
        <button id="musicBtn" onclick="toggleMusic()">🎻 Kemanı Hisset</button>
    </div>

    <audio id="violinAudio" loop src="https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Sample/main/sample.mp3"></audio>

    <script>
        const poems = [
            { text: "Sana bakmak bütün haftanın yorgunluğunu almak gibi.<br>Bir keman sesinde kaybolmak gibi seni sevmek.", author: "Turgut Uyar" },
            { text: "Gece usulca yaklaşır, pişmanlıklar birikir.<br>Anlarsın ki eksik kalan ne varsa dünyada, senin sesindedir.", author: "Özdemir Asaf" },
            { text: "Ben seni unutmak için sevseydim,<br>Sana olan sevgimi kalbime gömerdim.", author: "Cemal Süreya" }
        ];

        function nextPoem() {
            let randomIndex = Math.floor(Math.random() * poems.length);
            document.getElementById('poemText').innerHTML = poems[randomIndex].text;
            document.getElementById('poemAuthor').innerText = `- ${poems[randomIndex].author} -`;
        }

        function toggleMusic() {
            const audio = document.getElementById('violinAudio');
            const btn = document.getElementById('musicBtn');
            if (audio.paused) {
                audio.play();
                btn.innerText = "🔇 Kemanı Sustur";
            } else {
                audio.pause();
                btn.innerText = "🎻 Kemanı Hisset";
            }
        }
    </script>
</body>
</html>
