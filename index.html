<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0d0d0d; 
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        #overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #0d0d0d; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            text-align: center; 
            padding: 20px; 
        }
        
        #mainContent { 
            display: none; 
            text-align: center; 
            max-width: 600px; 
            padding: 20px; 
        }
        .poem-text { 
            font-size: 1.4rem; 
            font-style: italic; 
            margin-bottom: 25px; 
            line-height: 1.7; 
            color: #f5f5f5; 
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button { 
            background: transparent; 
            color: #d4af37; 
            border: 1px solid #d4af37; 
            padding: 12px 25px; 
            cursor: pointer; 
            border-radius: 50px; 
            font-size: 0.95rem; 
            transition: 0.3s; 
        }
        button:hover { 
            background: #d4af37; 
            color: #0d0d0d; 
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="overlay">
        <h1 style="margin-bottom:20px;">Sana Özel Bir An...</h1>
        <p style="color: #aaa; margin-bottom: 25px;">Sana söylemek istediklerim var...</p>
        <button onclick="startExperience()">🎙️ Dinlemek İçin Dokun</button>
    </div>

    <!-- ANA EKRAN -->
    <div id="mainContent">
        <h1 style="font-family: cursive; margin-bottom: 30px;">Bir Ses, Bir Pişmanlık...</h1>
        <div id="poemDisplay" class="poem-text">"Sana bakmak bütün haftanın yorgunluğunu almak gibi..."</div>
        
        <div class="button-group">
            <button onclick="changePoem()">Başka Şiire Geç 📜</button>
            <button id="toggleAudioBtn" onclick="toggleAudio()">🔊 Sesi Durdur</button>
        </div>
    </div>

    <!-- SES DOSYASI -->
    <audio id="audio" loop src="ses.mp3"></audio>

    <script>
        const poems = [
            "Sana bakmak bütün haftanın yorgunluğunu almak gibi.",
            "Bir keman sesinde kaybolmak gibi seni sevmek, ve unutmak geri kalan her şeyi...",
            "Gece usulca yaklaşır, pişmanlıklar birikir. Anlarsın ki eksik kalan ne varsa dünyada, aslında senin o dokunduğun tellerdedir.",
            "Ben seni unutmak için sevseydim, sana olan sevgimi kalbime gömerdim.",
            "Bütün ince şeyler kısalıyor, geç kalındı sanki bir şeylere."
        ];

        const audio = document.getElementById('audio');

        function startExperience() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            
            // Sesi 10. saniyeden başlatır (İstediğin saniyeye göre değiştirebilirsin)
            audio.currentTime = 10; 
            audio.play();
        }

        function changePoem() {
            const display = document.getElementById('poemDisplay');
            let randomPoem = poems[Math.floor(Math.random() * poems.length)];
            display.innerText = `"${randomPoem}"`;
        }

        // SESİ AÇMA / KAPAMA FONKSİYONU
        function toggleAudio() {
            const btn = document.getElementById('toggleAudioBtn');
            if (audio.paused) {
                audio.play();
                btn.innerText = "🔊 Sesi Durdur";
            } else {
                audio.pause();
                btn.innerText = "🔇 Sesi Başlat";
            }
        }
    </script>
</body>
</html>
