<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel...</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); 
            color: #d4af37; 
            font-family: 'Montserrat', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }
        
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; 
        }
        
        #mainContent { display: none; text-align: center; max-width: 500px; padding: 20px; animation: fadeIn 2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .poem-text { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-style: italic; margin: 30px 0; line-height: 1.6; color: #fff; }
        
        .btn-main { 
            background: transparent; color: #fff; border: 1px solid #d4af37; 
            padding: 15px 40px; cursor: pointer; border-radius: 2px; 
            font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.5s; 
        }
        .btn-main:hover { background: #d4af37; color: #000; }
        
        .btn-small { 
            background: none; border: 1px solid #555; color: #aaa; 
            padding: 10px 20px; cursor: pointer; border-radius: 2px; 
            font-size: 0.8rem; margin: 5px; transition: 0.3s;
        }
        .btn-small:hover { border-color: #d4af37; color: #d4af37; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 20px;">SANA ÖZEL</h1>
        <button class="btn-main" onclick="startExperience()">Dinlemek İçin Dokun</button>
    </div>

    <div id="mainContent">
        <h1 style="font-size: 1.2rem; letter-spacing: 3px; color: #d4af37;">BİR AN...</h1>
        <div id="poemDisplay" class="poem-text">"Sana bakmak bütün haftanın yorgunluğunu almak gibi..."</div>
        
        <div>
            <button class="btn-small" onclick="changePoem()">Başka Şiire Geç</button>
            <button class="btn-small" onclick="toggleAudio()" id="btnAudio">Sesi Durdur</button>
        </div>
    </div>

    <!-- DOSYA ADI SES.MP3 OLARAK BURADA TANIMLI -->
    <audio id="audio" loop src="ses.mp3"></audio>

    <script>
        const poems = [
            "Sana bakmak bütün haftanın yorgunluğunu almak gibi.",
            "Bir keman sesinde kaybolmak gibi seni sevmek...",
            "Gece usulca yaklaşır, pişmanlıklar birikir. Anlarsın ki eksik kalan ne varsa dünyada, senin dokunduğun tellerdedir.",
            "Ben seni unutmak için sevseydim, sana olan sevgimi kalbime gömerdim.",
            "Bütün ince şeyler kısalıyor, geç kalındı sanki bir şeylere."
        ];

        const audio = document.getElementById('audio');
        const btnAudio = document.getElementById('btnAudio');

        function startExperience() {
            document.getElementById('overlay').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                audio.play();
            }, 500);
        }

        function changePoem() {
            const display = document.getElementById('poemDisplay');
            display.innerText = `"${poems[Math.floor(Math.random() * poems.length)]}"`;
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                btnAudio.innerText = "Sesi Durdur";
            } else {
                audio.pause();
                btnAudio.innerText = "Sesi Başlat";
            }
        }
    </script>
</body>
</html>
